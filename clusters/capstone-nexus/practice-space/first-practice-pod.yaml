apiVersion: v1
kind: Pod
metadata:
  name: first-practice-pod
  namespace: practice-space
spec:
  containers:
    - name: nginx-web
      image: nginx:latest
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "20Mi"
          cpu: "10m"
        limits:
          memory: "200Mi"
          cpu: "100m"

