apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: microservices-sync  # Unique name for this sync
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/k3d-cluster/microservices-prod  # Points to your new folder
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
