apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccoe-app
  namespace: ccoe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ccoe-app
  template:
    metadata:
      labels:
        app: ccoe-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
